<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500;1,7..72,500&family=Manrope:wght@500;700&display=block">
<style>
/* The panel hangs tall: 1200 x 1600. Only six inks exist; any other color is forced to the nearest one.
   The panel's white looks like warm, matte paper on the wall. */
:root{--W:#ffffff;--K:#000000;--R:#e53935;--Y:#ffd800;--G:#1db954;--B:#004cff;
  --serif:"Literata",Georgia,serif;--sans:"Manrope",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--W)}
.screen{width:1200px;height:1600px;background:var(--W);color:var(--K);font-family:var(--sans);font-weight:500;display:flex;flex-direction:column;overflow:hidden}

/* home: photo, one quiet header row, rolling weeks */
.photo{flex:none;width:1200px;background:var(--W)}
.photo img{display:block;width:1200px;height:100%;image-rendering:pixelated}
.photo.empty{border-bottom:2px solid var(--K)}
.hd{display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:center;padding:26px 48px 24px}
.dt b{display:block;font-family:var(--serif);font-weight:500;font-size:66px;line-height:1;letter-spacing:-.01em}
.dt b i{font-style:italic}
.dt span{display:block;font-size:24px;margin-top:10px}
.dt em{font-style:normal;font-weight:700;font-size:18px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:6px}
.rows{border-left:2px solid var(--K);padding-left:28px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:grid;grid-template-columns:150px 1fr;gap:14px;font-size:25px;line-height:1.2}
.row small{font-size:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding-top:5px}
.row.hot small,.row.hot b{color:var(--R)}
.row.hot.go{background:var(--G);margin-left:-14px;padding:8px 14px}
.row.hot.go small,.row.hot.go b{color:var(--W)}
.row b{font-family:var(--serif);font-weight:500;font-size:30px;display:block}
.row .note{display:block;font-size:20px;margin-top:3px}
.row.check span::before{content:"";display:inline-block;width:16px;height:16px;border:2px solid var(--K);margin-right:10px;vertical-align:-1px}
.cal{flex:1;padding:0 48px 34px;display:flex;min-height:0}
.grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);column-gap:14px;border-top:2px solid var(--K);min-height:0}
.h{font-size:16px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center}
.c{padding:10px 0 0;border-top:1px solid var(--K);display:flex;flex-direction:column;gap:5px;min-width:0;overflow:hidden}
.n{font-family:var(--serif);font-size:32px;line-height:1}
.n small{font-family:var(--sans);font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-left:6px;vertical-align:4px}
.c.past .n{text-decoration:line-through;text-decoration-thickness:2px}
.c.past .e,.c.past .more{display:none}
.c.t{border-top:5px solid var(--R);padding-top:6px}
.c.t .n{color:var(--R)}
.e{font-size:19px;line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:none}
.one .e{-webkit-line-clamp:1}
.e b{font-weight:700}
.e.dot::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--B)}
.e.chore::before{background:var(--K)}
.e.prep::before{background:var(--G)}
.more{font-size:16px;font-weight:700}

/* today's meals */
.mtop{padding:44px 56px 0;display:flex;justify-content:space-between;align-items:baseline;font-size:26px}
.mtop b{font-family:var(--serif);font-weight:500;font-size:40px}
.mtop span b{font-family:var(--sans);font-weight:700;font-size:26px;color:var(--R)}
.meal{padding:30px 56px 0;display:flex;flex-direction:column;gap:16px}
.meal + .meal{margin-top:26px;border-top:2px solid var(--K);margin-left:56px;margin-right:56px;padding-left:0;padding-right:0}
.meal small{font-size:17px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--G)}
.meal h2{font-family:var(--serif);font-weight:500;font-size:50px;line-height:1.05;margin:0}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:8px;font-size:25px;line-height:1.3}
.steps li::before{content:counter(s);font-family:var(--serif);font-size:32px;line-height:1;color:var(--G)}
.plate{border-left:6px solid var(--G);padding-left:18px;font-size:23px;line-height:1.4}
.plate b{font-weight:700}
.bed{margin:auto 56px 0;padding:20px 0 40px;border-top:2px solid var(--K);font-size:25px;line-height:1.35;display:grid;grid-template-columns:28px 1fr;gap:10px}
.bed::before{content:"";width:18px;height:18px;border:2px solid var(--K);margin-top:6px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const M = window.MODEL, PAGE = window.PAGE, PH = window.PHOTO_HEIGHT || 800;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function home() {
  const h2 = M.header2, wx = M.weather ? `${M.weather.hi}° / ${M.weather.lo}° · ${esc(M.weather.text)}` : "";
  const rows = M.rows.map((r) => `<div class="row${r.hot ? " hot" : ""}${r.hot && M.head.urgent ? " go" : ""}${r.check ? " check" : ""}">
      <small>${esc(r.label)}</small><span>${r.hot ? `<b>${esc(r.text)}</b>` : esc(r.text)}${r.note ? `<span class="note">${esc(r.note)}</span>` : ""}</span></div>`).join("");
  const grid = M.dows.map((d) => `<div class="h">${d}</div>`).join("") + M.cells.map((c) =>
    `<div class="c${c.today ? " t" : ""}${c.past ? " past" : ""}"><div class="n">${c.day.replace(/^[A-Z][a-z]{2} /, "")}${/^[A-Z]/.test(c.day) ? `<small>${c.day.slice(0, 3)}</small>` : ""}</div>` +
    c.items.map((e) => e.prep ? `<div class="e dot prep">Prep day</div>`
      : e.allDay ? `<div class="e dot${e.chore ? " chore" : ""}">${esc(e.title)}</div>`
      : `<div class="e"><b>${e.time}</b> ${esc(e.title)}</div>`).join("") +
    (c.more ? `<div class="more">+${c.more} more</div>` : "") + `</div>`).join("");
  return `<div class="screen">
    <div class="photo${window.PHOTO ? "" : " empty"}" style="height:${window.PHOTO ? PH : 0}px">${window.PHOTO ? `<img src="${window.PHOTO}" alt="">` : ""}</div>
    <div class="hd"><div class="dt">${h2.tomorrow ? "<em>Tomorrow</em>" : ""}<b><i>${h2.weekday}</i><br>${h2.date}</b>${wx && !h2.tomorrow ? `<span>${wx}</span>` : ""}</div>
      <div class="rows">${rows}</div></div>
    <div class="cal${M.calendar.oneLine ? " one" : ""}"><div class="grid" style="grid-template-rows:44px ${M.calendar.thisWeekTaller ? `1.8fr repeat(${M.cells.length / 7 - 1},1fr)` : `repeat(${M.cells.length / 7},1fr)`}">${grid}</div></div>
  </div>`;
}

function meals() {
  const p = M.mealsPage, steps = (a) => `<ol class="steps">${a.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>`;
  return `<div class="screen">
    <div class="mtop"><b>${p.title}</b><span>${p.times}</span></div>
    <div class="meal"><small>Breakfast</small><h2>${esc(p.breakfast.name)}</h2>${steps(p.breakfast.steps)}</div>
    <div class="meal"><small>Dinner</small><h2>${esc(p.dinner.name)}</h2>${steps(p.dinner.steps)}${p.dinner.plate ? `<div class="plate"><b>${esc(p.childName)}'s plate:</b> ${esc(p.dinner.plate)}</div>` : ""}</div>
    ${p.beforeBed ? `<div class="bed"><span><b>Before bed:</b> ${esc(p.beforeBed)}</span></div>` : ""}
  </div>`;
}

document.getElementById("root").innerHTML = ({ home, meals })[PAGE]();
</script>
</body>
</html>
